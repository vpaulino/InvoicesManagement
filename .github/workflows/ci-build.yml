name: CI Build

on:
  push:
    branches: [ main, master, develop, features/** ]
    paths:
      - 'src/Email.Attachments/**'
      - 'src/Email.Attachments.McpServer/**'
      - '.github/workflows/ci-build.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/Email.Attachments/**'
      - 'src/Email.Attachments.McpServer/**'
      - '.github/workflows/ci-build.yml'

env:
  DOTNET_VERSION: '10.0.x'
  ATTACHMENTS_PROJECT: 'src/Email.Attachments/Email.Attachments.csproj'
  MCP_SERVER_PROJECT: 'src/Email.Attachments.McpServer/Email.Attachments.McpServer.csproj'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore — Email.Attachments
      run: dotnet restore ${{ env.ATTACHMENTS_PROJECT }}

    - name: Restore — Email.Attachments.McpServer
      run: dotnet restore ${{ env.MCP_SERVER_PROJECT }}
    
    - name: Build — Email.Attachments
      run: dotnet build ${{ env.ATTACHMENTS_PROJECT }} --configuration Release --no-restore

    - name: Build — Email.Attachments.McpServer
      run: dotnet build ${{ env.MCP_SERVER_PROJECT }} --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal || echo "No tests found"
      continue-on-error: true
    
    - name: Pack — Email.Attachments (validation only)
      run: dotnet pack ${{ env.ATTACHMENTS_PROJECT }} --configuration Release --no-build --output ./artifacts

    - name: Pack — Email.Attachments.McpServer (validation only)
      run: dotnet pack ${{ env.MCP_SERVER_PROJECT }} --configuration Release --no-build --output ./artifacts
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: ./artifacts/*.nupkg
        retention-days: 7
