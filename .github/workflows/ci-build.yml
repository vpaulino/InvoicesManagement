name: CI Build

on:
  push:
    branches: [ main, master, develop, features/** ]
    paths:
      - 'src/Email.Attachments/**'
      - 'src/Email.Attachments.McpServer/**'
      - 'src/Email.Attachments.McpServer.AspNetCore/**'
      - 'src/Email.Attachments.McpServer.Stdio/**'
      - '.github/workflows/ci-build.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/Email.Attachments/**'
      - 'src/Email.Attachments.McpServer/**'
      - 'src/Email.Attachments.McpServer.AspNetCore/**'
      - 'src/Email.Attachments.McpServer.Stdio/**'
      - '.github/workflows/ci-build.yml'

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'ConsolidateEmailFiles.sln'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal || echo "No tests found"
      continue-on-error: true
    
    - name: Pack Email.Attachments (validation only)
      run: dotnet pack src/Email.Attachments/Email.Attachments.csproj --configuration Release --no-build --output ./artifacts

    - name: Pack Email.Attachments.McpServer (validation only)
      run: dotnet pack src/Email.Attachments.McpServer/Email.Attachments.McpServer.csproj --configuration Release --no-build --output ./artifacts

    - name: Pack Email.Attachments.McpServer.AspNetCore (validation only)
      run: dotnet pack src/Email.Attachments.McpServer.AspNetCore/Email.Attachments.McpServer.AspNetCore.csproj --configuration Release --no-build --output ./artifacts

    - name: Pack Email.Attachments.McpServer.Stdio (validation only)
      run: dotnet pack src/Email.Attachments.McpServer.Stdio/Email.Attachments.McpServer.Stdio.csproj --configuration Release --no-build --output ./artifacts
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: ./artifacts/*.nupkg
        retention-days: 7
